<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>beeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    /* one accent, used only where something is true: a parameter, a focus,
       the primary action. everything else is paper and ink. */
    --accent:#B0761A; --accent-ink:#8A5A0E; --accent-soft:#F8F0DF; --accent-edge:#E8D6AF;
    --paper:#FCFBF9; --surface:#FFFFFF; --sunk:#F5F3EE;
    --line:#E8E4DB; --line-2:#D8D2C5;
    --ink:#17140F; --ink-2:#4C4638; --muted:#8C8575;
    --green:#2F7D4F; --green-soft:#EDF5EF; --red:#B3402A; --amber:#9A7115;
    --lift:0 1px 2px rgba(30,22,8,.04);
    --display:"Fraunces",Georgia,serif;
    --sans:"DM Sans",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden}

  /* ---- chrome ---- */
  header{display:flex;align-items:center;gap:10px;padding:0 20px;height:52px;flex-shrink:0;
    border-bottom:1px solid var(--line);background:var(--surface)}
  .mark{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.02em}
  .tagline{color:var(--muted);font-size:12.5px;padding-left:12px;margin-left:2px;
    border-left:1px solid var(--line)}
  .spacer{flex:1}
  .status{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;
    opacity:0;transition:opacity .2s}
  .status.on{opacity:1}
  .status::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent);margin-right:7px;vertical-align:middle;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .bee{width:24px;height:19px;flex-shrink:0}
  .bee .wing{transform-origin:12px 7px;animation:flap .15s ease-in-out infinite alternate}
  .bee .wing.r{transform-origin:20px 7px}
  .bee.resting .wing{animation:none;opacity:.55}
  @keyframes flap{from{transform:rotate(-14deg) scaleY(.9)}to{transform:rotate(16deg)}}
  @media (prefers-reduced-motion:reduce){.bee .wing,.status::before{animation:none}}

  /* ---- two lanes: the run on the left, what it produced on the right ---- */
  .stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
  body.running .stage{grid-template-columns:minmax(0,1fr) 420px}
  .lane{display:flex;flex-direction:column;min-width:0;min-height:0}
  .rail{display:none;border-left:1px solid var(--line);background:var(--surface);
    overflow-y:auto;padding:16px}
  body.running .rail{display:block}
  /* narrow: the rail can't sit beside the lane, but hiding it would take the
     try-it panel away entirely. stack it under the thread and let the page
     scroll as one instead. */
  @media (max-width:1100px){
    body.running .stage{grid-template-columns:minmax(0,1fr);display:block;overflow-y:auto}
    body.running .lane{display:block}
    body.running .thread{overflow:visible}
    body.running .rail{border-left:0;border-top:1px solid var(--line);
      max-width:720px;margin:0 auto;background:transparent}
    body.running .composer{position:sticky;bottom:0;background:var(--paper)}
  }

  .thread{flex:1;overflow-y:auto;min-height:0}
  .inner{max-width:720px;margin:0 auto;padding:28px 24px 8px}

  /* ---- the empty state. quiet. ---- */
  .hero{padding:12vh 0 0;text-align:center}
  .hero h1{font-family:var(--display);font-weight:500;font-size:clamp(26px,3.4vw,34px);
    margin:0 0 12px;letter-spacing:-.025em;line-height:1.15;color:var(--ink)}
  .hero p{color:var(--muted);margin:0 auto;max-width:46ch;font-size:14.5px}
  .hero.gone{display:none}
  .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .chip{font-family:var(--mono);font-size:11.5px;background:transparent;border:1px solid var(--line-2);
    border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--ink-2);transition:.12s}
  .chip:hover{border-color:var(--ink-2);background:var(--surface)}

  /* ---- turns ---- */
  .turn-you{display:flex;justify-content:flex-end;margin:20px 0 14px}
  .bubble{background:var(--ink);color:#F7F4EE;padding:8px 14px;border-radius:12px 12px 3px 12px;
    max-width:76%;font-size:14px}
  .turn{display:flex;gap:11px;margin-bottom:12px}
  .avatar{width:26px;height:26px;border-radius:7px;background:var(--surface);
    border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}
  .avatar svg{width:16px;height:13px}
  .turn-body{flex:1;min-width:0}

  .built{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .built-top{display:flex;align-items:baseline;gap:9px;padding:14px 16px 0;flex-wrap:wrap}
  .tick{color:var(--green);font-size:12px;align-self:center}
  .kicker{font-size:13px;color:var(--muted)}
  .name{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .badge{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .badge::before{content:"\00b7";margin-right:8px;color:var(--line-2)}
  .badge.heal{color:var(--green)}
  /* the punchline. the only large number on the page. */
  .headline{margin-left:auto;font-family:var(--display);font-weight:600;font-size:26px;
    color:var(--ink);letter-spacing:-.03em;align-self:center}
  .built-sub{padding:6px 16px 14px;color:var(--ink-2);font-size:13.5px}
  .built-sub b{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:500}

  /* disclosures. sentence case on purpose: uppercase mono on every label
     flattens the hierarchy until nothing reads as more important than
     anything else, which is what made this look generated. */
  .fold{border-top:1px solid var(--line)}
  .fold>summary{cursor:pointer;list-style:none;padding:9px 16px;display:flex;align-items:center;
    gap:9px;font-size:13px;color:var(--ink-2);transition:background .12s}
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary:hover{background:var(--sunk)}
  .fold>summary::before{content:"";width:5px;height:5px;border-right:1.5px solid var(--muted);
    border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin-left:2px;transition:transform .15s}
  .fold[open]>summary::before{transform:rotate(45deg)}
  .fold>summary .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .fold-body{padding:2px 16px 16px}

  .think{border-left:1px solid var(--line);padding:2px 0 2px 16px;margin-left:2px}
  .step{display:flex;gap:9px;padding:3px 0;color:var(--ink-2);font-size:13.5px;opacity:0;
    transform:translateY(2px);animation:rise .28s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .step .dot{width:12px;flex-shrink:0;color:var(--line-2);font-size:11px;text-align:center}
  .step.key{color:var(--ink)}
  .step.key .dot{color:var(--green)}
  .step b{color:var(--accent-ink);font-weight:500;font-family:var(--mono);font-size:12.5px}

  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11.5px}
  th{text-align:left;color:var(--muted);font-weight:400;padding:0 10px 8px 0;font-size:10.5px}
  td{padding:6px 10px 6px 0;white-space:nowrap;max-width:165px;overflow:hidden;
    text-overflow:ellipsis;border-top:1px solid var(--line)}
  tr.static td{color:var(--muted)}
  tr.param td{color:var(--accent-ink);background:var(--accent-soft)}
  tr.param td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
  tr.volatile td{color:var(--amber)}
  tr.src td{color:var(--amber);font-size:10.5px;border-top:0;padding-top:0;opacity:.8}
  .tag{font-size:10px;color:var(--muted)}

  pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--ink-2);
    background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:12px 13px;
    overflow:auto;max-height:300px}
  .wire{max-height:200px;overflow:auto;font-family:var(--mono);font-size:11px}
  .req{display:flex;gap:10px;padding:2px 0;color:var(--muted)}
  .req .m{width:34px;color:var(--ink-2)}
  .req .p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .req .s{color:var(--green)} .req .s.bad{color:var(--red)}

  /* ---- the rail ---- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;
    margin-bottom:10px;overflow:hidden}
  .panel>summary{cursor:pointer;list-style:none;padding:10px 13px;display:flex;align-items:center;gap:9px}
  .panel>summary::-webkit-details-marker{display:none}
  .panel>summary::before{content:"";width:5px;height:5px;border-right:1.5px solid var(--muted);
    border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
  .panel[open]>summary::before{transform:rotate(45deg)}
  .panel>summary .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted)}
  .panel>summary .r{margin-left:auto;color:var(--muted);font-size:11px;font-family:var(--mono)}
  .panel-body{padding:0 13px 13px}
  iframe{width:100%;height:290px;border:1px solid var(--line);border-radius:7px;display:block;
    background:var(--sunk)}
  .empty{color:var(--muted);padding:20px 0;font-size:12.5px;text-align:center}

  .tryit{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:11px}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}
  .field label{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .field input{font-family:var(--mono);font-size:12.5px;padding:8px 10px;border:1px solid var(--line-2);
    border-radius:7px;background:var(--surface);color:var(--ink);outline:0;width:100%;transition:.12s}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field label .type{color:var(--accent-ink);margin-left:4px}
  .curl{display:flex;align-items:center;gap:9px;background:var(--sunk);border:1px solid var(--line);
    border-radius:7px;padding:8px 10px;margin-bottom:11px;overflow:auto}
  .curl code{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap;flex:1}
  .copy{background:var(--surface);border:1px solid var(--line-2);border-radius:5px;padding:3px 8px;
    font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;flex-shrink:0}
  .copy:hover{border-color:var(--ink-2);color:var(--ink-2)}
  .run{background:var(--ink);color:#F7F4EE;border:0;border-radius:7px;padding:9px 16px;
    font-family:var(--sans);font-weight:500;font-size:13px;cursor:pointer;transition:.12s}
  .run:hover{background:var(--accent-ink)}
  .run:disabled{opacity:.35;cursor:default}
  .resline{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .resline b{color:var(--green);font-weight:500} .resline b.bad{color:var(--red)}

  /* ---- composer ---- */
  .composer{padding:12px 24px 18px;flex-shrink:0}
  .box{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto;background:var(--surface);
    border:1px solid var(--line-2);border-radius:11px;padding:5px 5px 5px 15px;
    box-shadow:var(--lift);transition:.14s}
  .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .box input{flex:1;border:0;outline:0;font-family:var(--sans);font-size:14.5px;color:var(--ink);
    background:transparent;padding:9px 0}
  .box input::placeholder{color:var(--muted)}
  .go{background:var(--ink);border:0;border-radius:8px;width:34px;height:34px;cursor:pointer;
    color:#F7F4EE;font-size:14px;flex-shrink:0;transition:.12s}
  .go:hover{background:var(--accent-ink)}
  .go:disabled{opacity:.3;cursor:default}
  .opts{display:flex;gap:16px;justify-content:center;margin-top:11px;color:var(--muted);font-size:12px}
  .opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
  .opts input{accent-color:var(--accent-ink)}
  a{color:var(--accent-ink)}
  @media (max-width:640px){.tagline{display:none}}
</style>
</head>
<body>

<header>
  <svg class="bee resting" id="bee" viewBox="0 0 32 24" aria-hidden="true">
    <ellipse class="wing" cx="12" cy="6" rx="6.2" ry="3.6" fill="#BFDCEC" opacity=".85"/>
    <ellipse class="wing r" cx="20" cy="6" rx="6.2" ry="3.6" fill="#BFDCEC" opacity=".85"/>
    <ellipse cx="16" cy="14" rx="9" ry="7" fill="#E5A42B"/>
    <path d="M12.5 8.2 A9 7 0 0 0 12.5 19.8" stroke="#1F1810" stroke-width="2.3" fill="none"/>
    <path d="M17.5 7.6 A9 7 0 0 0 17.5 20.4" stroke="#1F1810" stroke-width="2.3" fill="none"/>
    <circle cx="23.6" cy="12.4" r="1" fill="#1F1810"/>
  </svg>
  <div class="mark">beeline</div>
  <div class="spacer"></div>
  <div class="status" id="status"></div>
</header>

<main class="stage">
  <section class="lane">
    <div class="thread" id="thread">
      <div class="inner">
        <section class="hero" id="hero">
          <h1>Every website already has an API.</h1>
          <p>Name one and what you want from it. Beeline uses it once, works out the call
             underneath, and writes you a typed client.</p>
          <div class="chips" id="chips"></div>
        </section>
        <div id="turns"></div>
      </div>
    </div>

    <div class="composer">
      <div class="box">
        <input id="prompt" autocomplete="off" placeholder="get oscar films by year from scrapethissite.com">
        <button class="go" id="go" title="build it">&rarr;</button>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="cloud" checked> run in the cloud</label>
        <label><input type="checkbox" id="cached"> reuse last capture</label>
      </div>
    </div>
  </section>

  <aside class="rail" id="dock"></aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const BRAIN = "https://beeline-brain.gurvirrandhawa28.workers.dev";
const BEE = `<svg viewBox="0 0 32 24"><ellipse cx="12" cy="6" rx="6" ry="3.4" fill="#BFDCEC"/><ellipse cx="20" cy="6" rx="6" ry="3.4" fill="#BFDCEC"/><ellipse cx="16" cy="14" rx="8.6" ry="6.8" fill="#E5A42B"/><path d="M12.5 8.4 A8.6 6.8 0 0 0 12.5 19.6" stroke="#1F1810" stroke-width="2.2" fill="none"/><path d="M17.5 7.8 A8.6 6.8 0 0 0 17.5 20.2" stroke="#1F1810" stroke-width="2.2" fill="none"/></svg>`;

let es=null, count=0, flow="", lastReplay="", params=[], clientSrc="", t0=0;
let paramTypes={}, paramDefaults={}, known=[];
let elThink, elThinkN, elDiff, elDiffN, elWire, elWireN, elTop, elSub, elBuilt;
let pLive, pLiveBody, pLiveR, pTry, pTryBody;

fetch("/api/flows").then(r => r.json()).then(flows => {
  known = flows;
  $("chips").innerHTML = flows.map(f => `<button class="chip" data-flow="${f}">${f}</button>`).join("");
  $("chips").onclick = (e) => { const f = e.target.dataset.flow; if (f) { $("prompt").value = f; start(f); } };
});
$("go").onclick = () => start($("prompt").value.trim());
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter") start($("prompt").value.trim()); });

const bee = (fly) => {
  $("bee").classList.toggle("resting", !fly);
  $("bee").classList.toggle("flying", fly);
  $("status").classList.toggle("on", fly);
};
const scroll = () => $("thread").scrollTo({ top: $("thread").scrollHeight, behavior: "smooth" });

function say(html, key) {
  const d = document.createElement("div");
  d.className = "step" + (key ? " key" : "");
  d.innerHTML = `<span class="dot">${key ? "✓" : "·"}</span><span>${html}</span>`;
  elThink.appendChild(d);
  elThinkN.textContent = `${elThink.childElementCount} steps`;
  const fold = elThink.closest(".fold");
  fold.hidden = false;
  fold.open = true;
  scroll();
}

function turn(asked, cached) {
  $("hero").classList.add("gone");
  const you = document.createElement("div");
  you.className = "turn-you";
  you.innerHTML = `<div class="bubble">${esc(asked)}</div>`;
  $("turns").appendChild(you);

  const t = document.createElement("div");
  t.className = "turn";
  t.innerHTML = `
    <div class="avatar">${BEE}</div>
    <div class="turn-body"><div class="built">
      <div class="built-top">
        <span class="tick">●</span><span class="kicker">building</span>
        <span class="name">${esc(flow)}</span>
      </div>
      <div class="built-sub">${cached ? "reusing the capture from last time" : "opening a browser and doing the task three times"}</div>
      <details class="fold" open hidden><summary>how it worked <span class="n"></span></summary>
        <div class="fold-body"><div class="think"></div></div></details>
      <details class="fold" hidden><summary>what changed across runs <span class="n"></span></summary>
        <div class="fold-body"></div></details>
      <details class="fold" hidden><summary>traffic it recorded <span class="n"></span></summary>
        <div class="fold-body"><div class="wire"></div></div></details>
    </div></div>`;
  $("turns").appendChild(t);

  const folds = t.querySelectorAll(".fold");
  elBuilt = t.querySelector(".built");
  elTop = t.querySelector(".built-top");
  elSub = t.querySelector(".built-sub");
  elThink = t.querySelector(".think");
  elThinkN = folds[0].querySelector(".n");
  elDiff = folds[1].querySelector(".fold-body");
  elDiffN = folds[1].querySelector(".n");
  elWire = t.querySelector(".wire");
  elWireN = folds[2].querySelector(".n");
  scroll();
}

function dock(cached) {
  document.body.classList.add("running");
  $("dock").innerHTML = `
    <details class="panel" id="pLive"${cached ? "" : " open"}>
      <summary><span class="lbl">live browser</span><span class="r"></span></summary>
      <div class="panel-body"><div class="empty">${cached ? "no browser this time — reusing the last capture" : "opening a browser…"}</div></div>
    </details>
    <details class="panel" id="pTry">
      <summary><span class="lbl">try it</span><span class="r">ready once it's built</span></summary>
      <div class="panel-body"><div class="empty">waiting for the client</div></div>
    </details>`;
  pLive = $("pLive"); pLiveBody = pLive.querySelector(".panel-body"); pLiveR = pLive.querySelector(".r");
  pTry = $("pTry"); pTryBody = pTry.querySelector(".panel-body");
}

function start(name) {
  if (!name) return;

  // find a flow we actually have. free-text prompts aren't parsed yet, so
  // rather than mangling the sentence into a name that doesn't exist and
  // failing silently, say so.
  const words = name.toLowerCase().split(/[^a-z0-9-]+/).filter(Boolean);
  flow = known.find(f => words.includes(f)) ?? (known.includes(name) ? name : "");

  // not one we know? if there's a url in there, go and learn it
  if (!flow) {
    if (/\.[a-z]{2,}/i.test(name)) return learnNew(name);
    return dontKnow(name);
  }

  $("prompt").value = "";
  if (es) es.close();
  count = 0; lastReplay = ""; clientSrc = ""; params = []; t0 = Date.now();

  const cached = $("cached").checked;
  turn(name, cached);
  dock(cached);
  $("go").disabled = true;
  bee(true);
  if (cached) say("using the capture from last time");

  const q = new URLSearchParams({ flow, cloud: $("cloud").checked ? "1" : "0", cached: cached ? "1" : "0" });
  es = new EventSource("/api/run?" + q);
  es.onmessage = (e) => handle(JSON.parse(e.data));
  es.onerror = () => { done(); es.close(); };
}

function done() { $("go").disabled = false; bee(false); }

// a site we've never seen. work out how to vary it, write the flow, run it.
async function learnNew(asked) {
  $("prompt").value = "";
  $("go").disabled = true;
  bee(true);
  $("hero").classList.add("gone");

  const you = document.createElement("div");
  you.className = "turn-you";
  you.innerHTML = `<div class="bubble">${esc(asked)}</div>`;
  $("turns").appendChild(you);
  scroll();

  let res;
  try {
    res = await (await fetch("/api/new", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ prompt: asked }),
    })).json();
  } catch {
    res = { error: "couldn't reach the planner" };
  }

  if (res.error) {
    done();
    const t = document.createElement("div");
    t.className = "turn";
    t.innerHTML = `<div class="avatar">${BEE}</div><div class="turn-body"><div class="built">
      <div class="built-top"><span class="tick" style="color:var(--amber)">!</span>
        <span class="kicker">can't plan that</span></div>
      <div class="built-sub">${esc(res.error)}</div></div></div>`;
    $("turns").appendChild(t);
    return scroll();
  }

  if (!known.includes(res.flow)) known.push(res.flow);
  $("prompt").value = res.flow;
  start(res.flow);
  // say what it decided, once the turn exists
  setTimeout(() => say(`never seen that site — ${esc(res.why)}`), 60);
}

// asked for something we haven't learned. this is a real answer, not an error
function dontKnow(asked) {
  $("prompt").value = "";
  $("hero").classList.add("gone");
  const you = document.createElement("div");
  you.className = "turn-you";
  you.innerHTML = `<div class="bubble">${esc(asked)}</div>`;
  $("turns").appendChild(you);

  const t = document.createElement("div");
  t.className = "turn";
  t.innerHTML = `<div class="avatar">${BEE}</div><div class="turn-body"><div class="built">
    <div class="built-top"><span class="tick" style="color:var(--amber)">!</span>
      <span class="kicker">not learned yet</span></div>
    <div class="built-sub">I can only run sites I've already been shown. Reading a plain
      sentence and going off to learn a new site isn't wired up yet — that needs the
      parser.<br><br>Try one of these: ${known.map(f =>
        `<button class="chip" data-flow="${f}" style="margin:4px 4px 0 0">${f}</button>`).join("")}</div>
  </div></div>`;
  t.querySelector(".built-sub").addEventListener("click", (e) => {
    const f = e.target.dataset.flow;
    if (f) start(f);
  });
  $("turns").appendChild(t);
  $("dock").innerHTML = "";
  document.body.classList.remove("running");
  scroll();
}

function handle(ev) {
  if (ev.type === "stage") $("status").textContent = ev.name;

  if (ev.type === "run-start") {
    pLiveR.textContent = `run ${ev.run} of ${ev.of}`;
    const what = Object.entries(ev.input).map(([k, v]) => `${k}=${v}`).join(" ");
    say(ev.run === 1 ? `ran the task with <b>${esc(what)}</b>` : `ran it again with <b>${esc(what)}</b>`);
    pLiveBody.innerHTML = ev.liveUrl
      ? `<iframe src="${ev.liveUrl}" sandbox="allow-scripts allow-same-origin"></iframe>`
      : `<div class="empty">running locally — tick “run in the cloud” to watch</div>`;
  }

  if (ev.type === "exchange") {
    count++;
    elWireN.textContent = `${count} requests`;
    const r = document.createElement("div");
    r.className = "req";
    r.innerHTML = `<span class="m">${ev.method}</span><span class="p">${esc(ev.path)}</span><span class="s${ev.status >= 400 ? " bad" : ""}">${ev.status}</span>`;
    elWire.closest(".fold").hidden = false;
    elWire.appendChild(r);
    while (elWire.childElementCount > 150) elWire.removeChild(elWire.firstChild);
    elWire.scrollTop = elWire.scrollHeight;
  }

  if (ev.type === "run-done") {
    if (ev.sessionUrl) lastReplay = ev.sessionUrl;
    say(`recorded ${ev.exchanges} requests in ${(ev.ms / 1000).toFixed(1)}s`);
    pLiveBody.innerHTML = `<div class="empty">run ${ev.run} captured` +
      (lastReplay ? ` · <a href="${lastReplay}" target="_blank">watch the replay</a>` : "") + `</div>`;
  }

  if (ev.type === "spec") loadSpec();
  if (ev.type === "client") loadClient();
  if (ev.type === "verified") finish(ev);
  if (ev.type === "done") {
    done();
    $("status").textContent = "";
    if (ev.code !== 0) {
      elTop.innerHTML = `<span class="tick" style="color:var(--red)">×</span>
        <span class="kicker">couldn't build it</span><span class="name">${esc(flow)}</span>`;
      elSub.textContent = "The pipeline stopped early. The run log is in the terminal.";
    }
  }
}

async function loadSpec() {
  const spec = await (await fetch(`/api/spec?flow=${flow}`)).json();
  const runs = spec.fields[0]?.samples.length ?? 0;
  const order = { param: 0, volatile: 1, static: 2 };
  const fields = [...spec.fields].sort((a, b) => order[a.kind] - order[b.kind]);
  params = [...new Set(fields.filter(f => f.kind === "param" && f.boundTo).map(f => f.boundTo))];

  // every sample numeric? then it's a number. cheap, and it makes the
  // generated api look like something someone designed
  paramTypes = {}; paramDefaults = {};
  for (const f of fields.filter(f => f.kind === "param" && f.boundTo)) {
    paramTypes[f.boundTo] = f.samples.every(s => s !== "" && !isNaN(Number(s))) ? "int" : "str";
    paramDefaults[f.boundTo] = f.samples[f.samples.length - 1] ?? "";
  }

  say("lined the runs up and compared every field");
  for (const f of fields.filter(f => f.kind === "param"))
    say(`<b>${esc(f.name)}</b> followed your input — that's the parameter`, true);
  for (const f of fields.filter(f => f.kind === "volatile"))
    say(`<b>${esc(f.name)}</b> changed on its own — ${esc(describe(f.source))}`, true);

  const rows = fields.map(f => {
    const cells = f.samples.map(s => `<td>${esc(s)}</td>`).join("");
    const tag = f.kind === "param" ? `PARAM (${f.boundTo ?? ""})` : f.kind === "volatile" ? "VOLATILE" : "";
    let html = `<tr class="${f.kind}"><td>${f.location}</td><td>${esc(f.name)}</td>${cells}<td class="tag">${tag}</td></tr>`;
    if (f.kind === "volatile" && f.source)
      html += `<tr class="src"><td></td><td colspan="${runs + 2}">&#8627; ${esc(describe(f.source))}</td></tr>`;
    return html;
  }).join("");

  elDiff.closest(".fold").hidden = false;
  elDiffN.textContent = ["param", "volatile", "static"]
    .map(k => `${fields.filter(f => f.kind === k).length} ${k}`).join(" · ");
  elDiff.innerHTML = `<table><tr><th>in</th><th>field</th>${
    Array.from({ length: runs }, (_, i) => `<th>run ${i + 1}</th>`).join("")}<th></th></tr>${rows}</table>`;
}

function describe(s) {
  if (!s) return "no source found";
  if (s.kind === "timestamp") return "it's a clock";
  if (s.kind === "unresolved") return "couldn't trace it — " + s.note;
  const v = s.via;
  const where = v.in === "set-cookie" ? "a cookie the site set"
    : v.in === "header" ? `the ${v.header} header`
    : v.in === "json" ? "an earlier response" : "the page HTML";
  return `found it in ${where}, from ${s.fromMethod} ${s.fromPath}`;
}

async function loadClient() {
  clientSrc = await (await fetch(`/api/client?flow=${flow}`)).text();
  say(`wrote ${clientSrc.split("\n").length} lines of typed client`, true);
}

function finish(ev) {
  const secs = ((Date.now() - t0) / 1000).toFixed(0);
  elTop.innerHTML =
    `<span class="tick">✓</span><span class="kicker">api built</span>
     <span class="name">${esc(flow)}</span>
     <span class="badge">${secs}s</span>
     <span class="badge heal">self-healing</span>
     <span class="headline">${ev.speedup}×</span>`;
  elSub.innerHTML = `<b>${ev.httpMs}ms</b> over HTTP instead of <b>${ev.browserMs}ms</b> through a browser — same data, nothing rendering a page.`;

  const fields = params.length
    ? params.map(p => {
        const t = paramTypes[p] ?? "str";
        return `<div class="field"><label>${esc(p)} <span class="type">${t}</span></label>
          <input id="p_${esc(p)}" value="${esc(paramDefaults[p] ?? "")}"></div>`;
      }).join("")
    : `<div class="field"><label>no parameters</label></div>`;

  // the curl has to track what's actually in the boxes. building it once from
  // the captured sample means it quietly disagrees with the thing you just ran.
  const curlFor = () => {
    const q = params
      .map(p => `${p}=${encodeURIComponent($(`p_${p}`)?.value ?? paramDefaults[p] ?? "")}`)
      .join("&");
    return `curl "${BRAIN}/call/${flow}${q ? "?" + q : ""}"`;
  };

  pTry.querySelector(".r").textContent = `${params.length || "no"} parameter${params.length === 1 ? "" : "s"}`;
  pTry.open = true;
  pLive.open = false;
  pTryBody.innerHTML =
    `<div class="tryit">${fields}<button class="run" id="callit">Run it</button></div>
     <div class="curl"><code id="curlcode"></code><button class="copy" id="copycurl">copy</button></div>
     <div id="callout"></div>
     <details class="fold" style="border:0;margin-top:10px">
       <summary style="padding-left:0">the client it wrote</summary>
       <div class="fold-body" style="padding-left:0"><pre>${esc(clientSrc)}</pre></div></details>`;
  const paintCurl = () => ($("curlcode").textContent = curlFor());
  paintCurl();
  for (const p of params) $(`p_${p}`)?.addEventListener("input", paintCurl);

  $("callit").onclick = call;
  $("copycurl").onclick = (e) => {
    navigator.clipboard?.writeText(curlFor());
    e.target.textContent = "copied";
    setTimeout(() => (e.target.textContent = "copy"), 1400);
  };
  say("done — try it in the panel below", true);
}

async function call() {
  const args = new URLSearchParams();
  for (const p of params) args.set(p, $(`p_${p}`).value);
  $("callit").disabled = true;
  $("callout").innerHTML = `<div class="resline">calling…</div>`;
  const started = performance.now();
  try {
    args.set("flow", flow);
    const res = await fetch(`/api/try?${args}`);
    const body = await res.json();
    if (body.error) throw new Error(body.error);
    // an api can answer with a thousand rows. dumping them all into the page
    // is unreadable and silently cutting it off looks like a bug, so say how
    // many there are and show the first few.
    const list = Array.isArray(body.data)
      ? body.data
      : Array.isArray(body.data?.data)
        ? body.data.data
        : null;
    const SHOW = 8;
    const shown = list ? list.slice(0, SHOW) : body.data;
    const count = list ? `${list.length} items · ` : "";
    const more =
      list && list.length > SHOW
        ? `

… ${list.length - SHOW} more — the client returns all of them`
        : "";
    $("callout").innerHTML =
      `<div class="resline"><b>${body.status}</b> · ${count}${body.ms}ms · live from the API beeline just built</div>
       <pre>${esc(JSON.stringify(shown, null, 2) + more)}</pre>`;
  } catch (err) {
    $("callout").innerHTML = `<div class="resline"><b class="bad">failed</b> — ${esc(err.message || err)}</div>`;
  }
  $("callit").disabled = false;
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }
</script>
